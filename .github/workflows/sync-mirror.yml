name: Sync mirror to 88lin.github.io

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Push copy to 88lin.github.io/gzh-skill-kit/
        run: |
          git config --global user.name "88lin"
          git config --global user.email "431761794@qq.com"
          git clone --depth 1 "https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/88lin/88lin.github.io.git" dst
          # 清掉旧副本再整体覆盖（保持源仓库单一来源）
          rm -rf dst/gzh-skill-kit
          mkdir -p dst/gzh-skill-kit
          # 排除 git 元数据与 CI 自身
          rsync -a --exclude='.git' --exclude='.github' ./ dst/gzh-skill-kit/
          cd dst
          if git diff --quiet; then
            echo "No changes to sync."
          else
            git add -A
            git commit -m "sync: gzh-skill-kit 自动镜像 $(git -C .. rev-parse --short HEAD)"
            git push origin main
          fi
